  "use:pain": {en: Pain, te: నొప్పి, hi: दर्द, or: ବିନ୍ଧା, ta: வலி, ml: വേദന}
  "use:pharyngitis": {en: Sore throat, te: గొంతు నొప్పి, hi: गले में खराश, or: ଗଳା ବିନ୍ଧା, ta: தொண்டை வலி, ml: തൊണ്ടവേദന}
  "use:rejuvenation": {en: Rejuvenating tonic, te: పునరుత్తేజం, hi: कायाकल्प (रसायन), or: ପୁନର୍ଯୌବନ, ta: புத்துணர்வு, ml: പുനരുജ്ജീവനം}
  "use:scurvy": {en: Scurvy (vitamin C deficiency), te: స్కర్వీ (విటమిన్ సి లోపం), hi: स्कर्वी (विटामिन सी की कमी), or: ସ୍କର୍ଭି (ଭିଟାମିନ ସି ଅଭାବ), ta: ஸ்கர்வி (வைட்டமின் சி குறைபாடு), ml: സ്കർവി (വിറ്റാമിൻ സി കുറവ്)}
  "use:sinusitis": {en: Sinusitis, te: సైనసైటిస్, hi: साइनस की सूजन, or: ସାଇନସାଇଟିସ୍, ta: சைனஸ் அழற்சி, ml: സൈനസൈറ്റിസ്}
  "use:sprains and strains": {en: Sprains, te: బెణుకులు, hi: मोच, or: ମୋଚ, ta: சுளுக்கு, ml: ഉളുക്ക്}
