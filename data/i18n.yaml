# Translations for the website's language switch.
#
#   en = English, te = Telugu, hi = Hindi, or = Odia, ta = Tamil, ml = Malayalam
#
# These are first drafts. A fluent speaker of each language should check them,
# especially the medicinal words. To correct a word, edit it here and commit;
# the website updates automatically. Do not change the key on the left of each line.
# {n}, {i} and {family} are filled in automatically: keep them as they are.
# If a translation is missing, the English text is shown.

