  "use:eczema": {en: Eczema, te: తామర, hi: एक्ज़िमा, or: ଏକଜିମା, ta: கரப்பான், ml: എക്സിമ}
  "use:diarrhea": {en: Diarrhoea, te: విరేచనాలు, hi: दस्त, or: ଝାଡ଼ା, ta: வயிற்றுப்போக்கு, ml: വയറിളക്കം}
  "use:scabies": {en: Scabies, te: గజ్జి, hi: खुजली (स्केबीज़), or: କୁଣ୍ଡିଆ, ta: சொறி சிரங்கு, ml: ചൊറി}
  "use:menorrhagia": {en: Heavy menstrual bleeding, te: అధిక రుతుస్రావం, hi: अत्यधिक मासिक रक्तस्राव, or: ଅଧିକ ଋତୁସ୍ରାବ, ta: அதிக மாதவிடாய் இரத்தப்போக்கு, ml: അമിത ആർത്തവ രക്തസ്രാവം}
  "use:hypotension": {en: Low blood pressure, te: తక్కువ రక్తపోటు, hi: निम्न रक्तचाप, or: ନିମ୍ନ ରକ୍ତଚାପ, ta: குறைந்த இரத்த அழுத்தம், ml: താഴ്ന്ന രക്തസമ്മർദ്ദം}
  "use:cerebrovascular circulation": {en: Blood circulation to the brain, te: మెదడుకు రక్త ప్రసరణ, hi: मस्तिष्क में रक्त संचार, or: ମସ୍ତିଷ୍କକୁ ରକ୍ତ ସଞ୍ଚାଳନ, ta: மூளைக்கு இரத்த ஓட்டம், ml: തലച്ചോറിലേക്കുള്ള രക്തചംക്രമണം}
  "use:common cold": {en: Common cold, te: జలుబు, hi: सर्दी-जुकाम, or: ଥଣ୍ଡା, ta: ஜலதோஷம், ml: ജലദോഷം}
  "use:leprosy": {en: Leprosy, te: కుష్టు వ్యాధి, hi: कुष्ठ रोग, or: କୁଷ୍ଠ ରୋଗ, ta: தொழுநோய், ml: കുഷ്ഠരോഗം}
  "use:endophthalmitis": {en: Eye inflammation, te: కంటి వాపు, hi: आँख की सूजन, or: ଆଖି ପ୍ରଦାହ, ta: கண் அழற்சி, ml: കണ്ണിലെ വീക്കം}
  "use:hemorrhage": {en: Bleeding, te: రక్తస్రావం, hi: रक्तस्राव, or: ରକ୍ତସ୍ରାବ, ta: இரத்தப்போக்கு, ml: രക്തസ്രാവം}
  "use:leukorrhea": {en: White discharge (leucorrhoea), te: తెల్లబట్ట, hi: श्वेत प्रदर, or: ଶ୍ୱେତ ପ୍ରଦର, ta: வெள்ளைப்படுதல், ml: വെള്ളപോക്ക്}
  # medicinal properties
  "use:anthelmintics": {en: Expels intestinal worms, te: నులిపురుగులను తొలగిస్తుంది, hi: पेट के कीड़े निकालता है, or: ପେଟ କୃମି ଦୂର କରେ, ta: குடற்புழுக்களை நீக்கும், ml: വിരകളെ നീക്കുന്നു}
  "use:anti-infective agents, local": {en: Prevents infection in wounds, te: గాయాల్లో ఇన్ఫెక్షన్ నివారిస్తుంది, hi: घावों में संक्रमण रोकता है, or: ଘାଆରେ ସଂକ୍ରମଣ ରୋକେ, ta: காயங்களில் தொற்றைத் தடுக்கும், ml: മുറിവുകളിലെ അണുബാധ തടയുന്നു}
  "use:anti-inflammatory agents": {en: Reduces swelling, te: వాపు తగ్గిస్తుంది, hi: सूजन कम करता है, or: ଫୁଲା କମାଏ, ta: வீக்கத்தைக் குறைக்கும், ml: വീക്കം കുറയ്ക്കുന്നു}
  "use:antifungal agents": {en: Antifungal, te: శిలీంధ్ర నాశిని, hi: फफूंदरोधी, or: କବକନାଶୀ, ta: பூஞ்சை எதிர்ப்பு, ml: ഫംഗസ് പ്രതിരോധം}
  "use:antirheumatic agents": {en: Relieves joint pain (rheumatism), te: కీళ్ల నొప్పులను తగ్గిస్తుంది, hi: जोड़ों का दर्द (गठिया) कम करता है, or: ଗଣ୍ଠି ବିନ୍ଧା କମାଏ, ta: மூட்டு வலியைக் குறைக்கும், ml: സന്ധിവേദന കുറയ്ക്കുന്നു}
  "use:anti-bacterial agents": {en: Antibacterial, te: బ్యాక్టీరియా నాశిని, hi: जीवाणुरोधी, or: ଜୀବାଣୁନାଶୀ, ta: பாக்டீரியா எதிர்ப்பு, ml: ബാക്ടീരിയ പ്രതിരോധം}
  "use:antiparasitic agents": {en: Acts against parasites, te: పరాన్నజీవులను నిరోధిస్తుంది, hi: परजीवी-रोधी, or: ପରଜୀବୀ ନାଶକ, ta: ஒட்டுண்ணி எதிர்ப்பு, ml: പരാദങ്ങൾക്കെതിരെ}
  "use:hypnotics and sedatives": {en: Calming; helps sleep, te: ప్రశాంతత; నిద్రకు సహాయం, hi: शांत करता है; नींद में सहायक, or: ଶାନ୍ତ କରେ; ନିଦ୍ରାରେ ସାହାଯ୍ୟ, ta: அமைதிப்படுத்தும்; தூக்கத்திற்கு உதவும், ml: ശാന്തമാക്കുന്നു; ഉറക്കത്തിന് സഹായിക്കുന്നു}
  "use:antiviral agents": {en: Antiviral, te: వైరస్ నిరోధకం, hi: विषाणुरोधी, or: ଭୂତାଣୁନାଶୀ, ta: வைரஸ் எதிர்ப்பு, ml: വൈറസ് പ്രതിരോധം}
  "use:antineoplastic agents": {en: Source of anticancer medicines, te: క్యాన్సర్ నిరోధక ఔషధాల మూలం, hi: कैंसर-रोधी दवाओं का स्रोत, or: କର୍କଟ ପ୍ରତିରୋଧୀ ଔଷଧର ଉତ୍ସ, ta: புற்றுநோய் எதிர்ப்பு மருந்துகளின் மூலம், ml: കാൻസർ പ്രതിരോധ ഔഷധങ്ങളുടെ ഉറവിടം}
  "use:antipruritics": {en: Relieves itching, te: దురద తగ్గిస్తుంది, hi: खुजली कम करता है, or: କୁଣ୍ଡେଇ କମାଏ, ta: அரிப்பைக் குறைக்கும், ml: ചൊറിച്ചിൽ കുറയ്ക്കുന്നു}
  "use:diuretics": {en: Increases urine flow, te: మూత్రవర్ధకం, hi: मूत्रवर्धक, or: ମୂତ୍ରବର୍ଦ୍ଧକ, ta: சிறுநீர் பெருக்கி, ml: മൂത്രവർദ്ധകം}
  "part:aerial part": {en: Aerial parts, te: పైభాగాలు, hi: ऊपरी भाग, or: ଉପର ଅଂଶ, ta: தரைமேல் பாகங்கள், ml: മുകൾഭാഗങ്ങൾ}
  "part:whole plant excluding root": {en: Whole plant (without root), te: వేరు తప్ప మొత్తం మొక్క, hi: जड़ को छोड़कर पूरा पौधा, or: ଚେର ବ୍ୟତୀତ ସମଗ୍ର ଗଛ, ta: வேர் தவிர முழுத் தாவரம், ml: വേരൊഴികെ സസ്യം മുഴുവൻ}
  "part:wood": {en: Wood, te: కలప, hi: लकड़ी, or: କାଠ, ta: மரக்கட்டை, ml: തടി}
  "use:abdominal pain": {en: Stomach ache, te: కడుపు నొప్పి, hi: पेट दर्द, or: ପେଟ ବିନ୍ଧା, ta: வயிற்று வலி, ml: വയറുവേദന}
  "use:abscess": {en: Abscesses (pus boils), te: చీము గడ్డలు, hi: फोड़े (मवाद वाले), or: ପୂଜ ଫୋଟକା, ta: சீழ்க்கட்டி, ml: പഴുപ്പുള്ള കുരു}
  "use:alopecia": {en: Hair loss, te: జుట్టు రాలడం, hi: बाल झड़ना, or: କେଶ ଝଡ଼ିବା, ta: முடி உதிர்தல், ml: മുടികൊഴിച്ചിൽ}
  "use:analgesics": {en: Relieves pain, te: నొప్పి తగ్గిస్తుంది, hi: दर्द कम करता है, or: ବିନ୍ଧା କମାଏ, ta: வலியைக் குறைக்கும், ml: വേദന കുറയ്ക്കുന്നു}
  "use:anasarca": {en: Body swelling (oedema), te: శరీర వాపు, hi: शरीर में सूजन (शोथ), or: ଶରୀର ଫୁଲା, ta: உடல் வீக்கம், ml: ശരീരത്തിലെ നീര്}
  "use:anemia": {en: Anaemia, te: రక్తహీనత, hi: खून की कमी (एनीमिया), or: ରକ୍ତହୀନତା, ta: இரத்தசோகை, ml: വിളർച്ച}
  "use:angiotensin-converting enzyme inhibitors": {en: Helps lower blood pressure, te: రక్తపోటు తగ్గించడంలో సహాయం, hi: रक्तचाप घटाने में सहायक, or: ରକ୍ତଚାପ କମାଇବାରେ ସାହାଯ୍ୟ, ta: இரத்த அழுத்தத்தைக் குறைக்க உதவும், ml: രക്തസമ്മർദ്ദം കുറയ്ക്കാൻ സഹായിക്കുന്നു}
  "use:antiemetics": {en: Stops vomiting, te: వాంతులు ఆపుతుంది, hi: उल्टी रोकता है, or: ବାନ୍ତି ବନ୍ଦ କରେ, ta: வாந்தியை நிறுத்தும், ml: ഛർദ്ദി തടയുന്നു}
  "use:antioxidants": {en: Antioxidant, te: యాంటీఆక్సిడెంట్, hi: एंटीऑक्सीडेंट, or: ଆଣ୍ଟିଅକ୍ସିଡାଣ୍ଟ, ta: ஆக்ஸிஜனேற்ற எதிர்ப்பி, ml: ആന്റിഓക്സിഡന്റ്}
  "use:antiperiodic": {en: Prevents recurring fevers, te: మళ్లీ వచ్చే జ్వరాలను నివారిస్తుంది, hi: बार-बार आने वाले बुखार को रोकता है, or: ବାରମ୍ବାର ଜ୍ୱର ରୋକେ, ta: திரும்ப வரும் காய்ச்சலைத் தடுக்கும், ml: ഇടവിട്ടുള്ള പനി തടയുന്നു}
  "use:antipyretics": {en: Reduces fever, te: జ్వరం తగ్గిస్తుంది, hi: बुखार कम करता है, or: ଜ୍ୱର କମାଏ, ta: காய்ச்சலைக் குறைக்கும், ml: പനി കുറയ്ക്കുന്നു}
  "use:antispasmodics": {en: Relieves cramps, te: కండరాల పట్టు తగ్గిస్తుంది, hi: ऐंठन कम करता है, or: ମାଂସପେଶୀ ଖିଞ୍ଚି ହେବା କମାଏ, ta: தசைப்பிடிப்பைக் குறைக்கும், ml: പേശിവലിവ് കുറയ്ക്കുന്നു}
  "use:appetite stimulants": {en: Improves appetite, te: ఆకలి పెంచుతుంది, hi: भूख बढ़ाता है, or: ଭୋକ ବଢ଼ାଏ, ta: பசியைத் தூண்டும், ml: വിശപ്പ് വർദ്ധിപ്പിക്കുന്നു}
  "use:asthenia": {en: Weakness, te: బలహీనత, hi: कमज़ोरी, or: ଦୁର୍ବଳତା, ta: உடல் பலவீனம், ml: ബലഹീനത}
  "use:asthma": {en: Asthma, te: ఉబ్బసం, hi: दमा, or: ଶ୍ୱାସ ରୋଗ (ଆଜମା), ta: ஆஸ்துமா, ml: ആസ്ത്മ}
  "use:astringents": {en: Astringent (tightens tissues), te: వగరు గుణం, hi: कसैला (ऊतक कसता है), or: କଷା ଗୁଣ, ta: துவர்ப்புத் தன்மை, ml: ചവർപ്പ് ഗുണം}
  "use:bronchitis": {en: Bronchitis, te: శ్వాసనాళాల వాపు, hi: श्वसनी शोथ (ब्रोंकाइटिस), or: ବ୍ରଙ୍କାଇଟିସ୍, ta: மூச்சுக்குழாய் அழற்சி, ml: ബ്രോങ്കൈറ്റിസ്}
  "use:cardiotonic agents": {en: Strengthens the heart, te: గుండెకు బలం, hi: हृदय को बल देता है, or: ହୃଦୟକୁ ଶକ୍ତି ଦିଏ, ta: இதயத்தை வலுப்படுத்தும், ml: ഹൃദയത്തിന് ബലം നൽകുന്നു}
  "use:cathartics": {en: Strong laxative (purgative), te: విరేచనకారి, hi: रेचक (जुलाब), or: ଜୋଲାପ, ta: பேதி மருந்து, ml: വിരേചനൗഷധം}
  "use:cholera": {en: Cholera, te: కలరా, hi: हैजा, or: କଲେରା, ta: காலரா, ml: കോളറ}
  "use:cholesterol": {en: High cholesterol, te: అధిక కొలెస్ట్రాల్, hi: उच्च कोलेस्ट्रॉल, or: ଅଧିକ କୋଲେଷ୍ଟେରଲ, ta: அதிக கொலஸ்ட்ரால், ml: ഉയർന്ന കൊളസ്ട്രോൾ}
  "use:constipation": {en: Constipation, te: మలబద్ధకం, hi: कब्ज़, or: କୋଷ୍ଠକାଠିନ୍ୟ, ta: மலச்சிக்கல், ml: മലബന്ധം}
  "use:cooling effect on body": {en: Cools the body, te: శరీరానికి చల్లదనం, hi: शरीर को ठंडक देता है, or: ଶରୀରକୁ ଥଣ୍ଡା କରେ, ta: உடலைக் குளிர்விக்கும், ml: ശരീരം തണുപ്പിക്കുന്നു}
  "use:cough": {en: Cough, te: దగ్గు, hi: खांसी, or: କାଶ, ta: இருமல், ml: ചുമ}
  "use:demulcents": {en: Soothes irritation, te: చికాకును తగ్గిస్తుంది, hi: जलन शांत करता है, or: ଜ୍ୱାଳା ଶାନ୍ତ କରେ, ta: எரிச்சலைத் தணிக்கும், ml: അസ്വസ്ഥത ശമിപ്പിക്കുന്നു}
  "use:dysentery": {en: Dysentery, te: రక్త విరేచనాలు, hi: पेचिश, or: ଆମାଶୟ, ta: சீதபேதி, ml: വയറുകടി}
  "use:dysmenorrhea": {en: Painful periods, te: బాధాకరమైన రుతుస్రావం, hi: मासिक धर्म का दर्द, or: ଋତୁସ୍ରାବ ବିନ୍ଧା, ta: மாதவிடாய் வலி, ml: ആർത്തവ വേദന}
  "use:dyspepsia": {en: Indigestion, te: అజీర్ణం, hi: अपच, or: ଅଜୀର୍ଣ୍ଣ, ta: அஜீரணம், ml: ദഹനക്കേട്}
  "use:emollients": {en: Softens and soothes skin, te: చర్మాన్ని మృదువుగా చేస్తుంది, hi: त्वचा को कोमल बनाता है, or: ଚର୍ମକୁ କୋମଳ କରେ, ta: தோலை மென்மையாக்கும், ml: ചർമ്മം മൃദുവാക്കുന്നു}
  "use:fatigue": {en: Tiredness, te: అలసట, hi: थकान, or: କ୍ଲାନ୍ତି, ta: சோர்வு, ml: ക്ഷീണം}
  "use:fever": {en: Fever, te: జ్వరం, hi: बुखार, or: ଜ୍ୱର, ta: காய்ச்சல், ml: പനി}
  "use:flatulence": {en: Gas and bloating, te: కడుపు ఉబ్బరం, hi: पेट में गैस, or: ପେଟ ଫମ୍ପା, ta: வாயுத் தொல்லை, ml: വയർ വീർപ്പ്}
  "use:furunculosis": {en: Boils, te: సెగ గడ్డలు, hi: फोड़े-फुंसी, or: ଫୋଟକା, ta: கொதிப்புக் கட்டிகள், ml: കുരുക്കൾ}
  "use:gastritis": {en: Stomach inflammation (gastritis), te: జీర్ణాశయ వాపు, hi: आमाशय की सूजन (गैस्ट्राइटिस), or: ପାକସ୍ଥଳୀ ପ୍ରଦାହ, ta: இரைப்பை அழற்சி, ml: ആമാശയ വീക്കം}
  "use:headache": {en: Headache, te: తలనొప్పి, hi: सिरदर्द, or: ମୁଣ୍ଡବିନ୍ଧା, ta: தலைவலி, ml: തലവേദന}
  "use:hemicrania": {en: Migraine, te: పార్శ్వపు నొప్పి, hi: आधासीसी (माइग्रेन), or: ଅଧକପାଳି, ta: ஒற்றைத் தலைவலி, ml: ചെന്നിക്കുത്ത്}
