  med_caution: {en: "For information only. Do not use for self-treatment; consult a qualified doctor.", te: "సమాచారం కోసం మాత్రమే. స్వయంగా చికిత్సకు వాడకండి; అర్హత గల వైద్యుడిని సంప్రదించండి.", hi: "केवल जानकारी के लिए। स्वयं उपचार न करें; योग्य चिकित्सक से परामर्श लें।", or: "କେବଳ ସୂଚନା ପାଇଁ। ନିଜେ ଚିକିତ୍ସା କରନ୍ତୁ ନାହିଁ; ଯୋଗ୍ୟ ଡାକ୍ତରଙ୍କ ପରାମର୍ଶ ନିଅନ୍ତୁ।", ta: "தகவலுக்கு மட்டுமே. சுயமாக சிகிச்சை செய்ய வேண்டாம்; தகுதியான மருத்துவரை அணுகவும்.", ml: "വിവരത്തിനു മാത്രം. സ്വയം ചികിത്സയ്ക്ക് ഉപയോഗിക്കരുത്; യോഗ്യതയുള്ള ഡോക്ടറെ സമീപിക്കുക."}
  med_poison: {en: "Poisonous plant: harmful if eaten. Do not taste any part.", te: "విషపూరిత మొక్క: తింటే హానికరం. ఏ భాగాన్నీ రుచి చూడకండి.", hi: "ज़हरीला पौधा: खाने पर हानिकारक। किसी भी भाग को न चखें।", or: "ବିଷାକ୍ତ ଗଛ: ଖାଇଲେ କ୍ଷତିକାରକ। କୌଣସି ଅଂଶ ଚାଖନ୍ତୁ ନାହିଁ।", ta: "நச்சுத் தாவரம்: உண்டால் தீங்கு. எந்தப் பகுதியையும் சுவைக்க வேண்டாம்.", ml: "വിഷസസ്യം: കഴിച്ചാൽ ഹാനികരം. ഒരു ഭാഗവും രുചിച്ചു നോക്കരുത്."}
  med_credit: {en: "Information from IMPPAT (IMSc, Chennai), compiled from books on traditional Indian medicine.", te: "సమాచారం: IMPPAT (IMSc, చెన్నై) – భారతీయ సంప్రదాయ వైద్య గ్రంథాల ఆధారంగా.", hi: "जानकारी: IMPPAT (IMSc, चेन्नई) – पारंपरिक भारतीय चिकित्सा ग्रंथों पर आधारित।", or: "ସୂଚନା: IMPPAT (IMSc, ଚେନ୍ନାଇ) – ପାରମ୍ପରିକ ଭାରତୀୟ ଚିକିତ୍ସା ଗ୍ରନ୍ଥ ଆଧାରରେ।", ta: "தகவல்: IMPPAT (IMSc, சென்னை) – பாரம்பரிய இந்திய மருத்துவ நூல்களின் அடிப்படையில்.", ml: "വിവരം: IMPPAT (IMSc, ചെന്നൈ) – പരമ്പരാഗത ഭാരതീയ വൈദ്യ ഗ്രന്ഥങ്ങളെ ആധാരമാക്കി."}
