  "use:toothache": {en: Toothache, te: పంటి నొప్పి, hi: दांत दर्द, or: ଦାନ୍ତ ବିନ୍ଧା, ta: பல்வலி, ml: പല്ലുവേദന}
  "use:toothbrushing": {en: Dental care (twig as toothbrush), te: దంతధావనం (పుల్లతో పళ్లు తోమడం), hi: दातुन (दाँत साफ़ करना), or: ଦାନ୍ତକାଠି, ta: பல் துலக்குதல், ml: പല്ലുതേക്കൽ}
  "use:tuberculosis, lymph node": {en: Tuberculosis of the glands, te: గ్రంథుల క్షయ, hi: गांठों का क्षय रोग, or: ଗ୍ରନ୍ଥି ଯକ୍ଷ୍ମା, ta: நிணநீர்க் கணு காசநோய், ml: ഗ്രന്ഥി ക്ഷയം}
  "use:urination disorders": {en: Urinary problems, te: మూత్ర సమస్యలు, hi: मूत्र संबंधी समस्याएँ, or: ପରିସ୍ରା ସମସ୍ୟା, ta: சிறுநீர்ப் பிரச்சினைகள், ml: മൂത്ര സംബന്ധമായ പ്രശ്നങ്ങൾ}
  "use:uterine diseases": {en: Uterine problems, te: గర్భాశయ సమస్యలు, hi: गर्भाशय रोग, or: ଗର୍ଭାଶୟ ରୋଗ, ta: கருப்பை நோய்கள், ml: ഗർഭാശയ രോഗങ്ങൾ}
  "use:wounds and injuries/trauma": {en: Wounds and injuries, te: గాయాలు, hi: घाव और चोट, or: ଘା ଓ ଆଘାତ, ta: காயங்கள், ml: മുറിവുകളും പരിക്കുകളും}
