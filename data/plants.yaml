# Campus plant data: the ONLY file you need to edit.
#
# RULES
#  * slug is PERMANENT once tags are printed. It is inside the QR code.
#  * scientific_name: the accepted name in Kew's World Checklist of Vascular Plants (WCVP).
#  * telugu_name: the common name shown on the tag and the web page, in Telugu script.
#    Several names can be separated by commas.
#  * common_names: English names. Used by the search box, and shown (in English) only
#    when telugu_name is empty because no Telugu name is known.
#  * caution: "poisonous" shows a poison warning in the Medicinal panel.
#  * copies: how many printed tags of this plant go into tags.pdf (each costs Rs 10).
#  * Optional fields (description, uses, native_to, flowering_season, photos, notes)
#    are shown on the plant's page only when they have a value. Leave them empty
#    until real, checked information is available.
#  * photos: a list of files placed in the photos/ folder, e.g.
#      photos:
#        - file: azadirachta-indica-1.jpg
#          caption: Flowering branch
#          credit: Photo by ...
#
# See README.md for step-by-step instructions.

